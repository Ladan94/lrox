<!-- =========================
     LROX FULLSCREEN VIDEO HERO
========================= -->

<section class="lrox-hero" id="home">
  <video
    class="lrox-hero__video"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
  >
    <source src="assets/video/lrox-hero.mp4" type="video/mp4" />
  </video>

  <div class="lrox-hero__overlay"></div>
  <div class="lrox-hero__glow"></div>

  <header class="lrox-header">
    <a class="lrox-logo" href="#home" aria-label="LROX Home">
      <span class="lrox-logo__mark"></span>
      <span>LROX</span>
    </a>

    <nav class="lrox-nav">
      <a href="#product">Product</a>
      <a href="#technology">Technology</a>
      <a href="#demo">Demo</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="lrox-header__cta" href="#contact">
      Pilot Partner
    </a>
  </header>

  <div class="lrox-hero__content">
    <div class="lrox-eyebrow">
      <span></span>
      AI-powered bicycle safety
    </div>

    <h1>
      Gefahren erkennen.<br />
      <strong>Bevor sie entstehen.</strong>
    </h1>

    <p>
      LROX erkennt kritische Verkehrssituationen in Echtzeit
      und warnt Radfahrende im entscheidenden Moment.
    </p>

    <div class="lrox-actions">
      <a class="lrox-btn lrox-btn--primary" href="#demo">
        Demo ansehen
        <span>→</span>
      </a>

      <a class="lrox-btn lrox-btn--secondary" href="#contact">
        Mehr erfahren
      </a>
    </div>
  </div>

  <div class="lrox-status">
    <span class="lrox-status__dot"></span>
    Live risk detection
  </div>

  <button
    class="lrox-video-toggle"
    type="button"
    aria-label="Pause video"
  >
    <span class="lrox-pause">Ⅱ</span>
    <span class="lrox-play" hidden>▶</span>
  </button>

  <div class="lrox-scroll">
    Scroll
    <span></span>
  </div>
</section>

<style>
  :root {
    --lrox-orange: #ff5b16;
    --lrox-orange-dark: #e94a08;
    --lrox-white: #ffffff;
    --lrox-black: #070707;
  }

  .lrox-hero,
  .lrox-hero * {
    box-sizing: border-box;
  }

  .lrox-hero {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background: var(--lrox-black);
    color: var(--lrox-white);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .lrox-hero a {
    color: inherit;
    text-decoration: none;
  }

  .lrox-hero__video {
    position: absolute;
    inset: 0;
    z-index: -4;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.015);
    filter:
      brightness(0.82)
      contrast(1.08)
      saturate(0.9);
  }

  .lrox-hero__overlay {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
      linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.9) 0%,
        rgba(0, 0, 0, 0.74) 32%,
        rgba(0, 0, 0, 0.34) 60%,
        rgba(0, 0, 0, 0.12) 100%
      ),
      linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.48) 0%,
        rgba(0, 0, 0, 0.02) 42%,
        rgba(0, 0, 0, 0.66) 100%
      );
  }

  .lrox-hero__glow {
    position: absolute;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(
        circle at 78% 45%,
        rgba(255, 91, 22, 0.14),
        transparent 28%
      );
  }

  .lrox-header {
    position: relative;
    z-index: 10;
    width: min(calc(100% - 64px), 1440px);
    height: 92px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 34px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }

  .lrox-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.24em;
    white-space: nowrap;
  }

  .lrox-logo__mark {
    position: relative;
    width: 14px;
    height: 14px;
    border: 2px solid var(--lrox-orange);
    border-radius: 50%;
  }

  .lrox-logo__mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--lrox-orange);
    transform: translate(-50%, -50%);
  }

  .lrox-nav {
    display: flex;
    gap: 32px;
    margin-left: auto;
  }

  .lrox-nav a {
    position: relative;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.94rem;
    transition: color 180ms ease;
  }

  .lrox-nav a::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -9px;
    left: 0;
    height: 1px;
    background: var(--lrox-orange);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 180ms ease;
  }

  .lrox-nav a:hover {
    color: #fff;
  }

  .lrox-nav a:hover::after {
    transform: scaleX(1);
  }

  .lrox-header__cta {
    min-height: 48px;
    padding: 0 20px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 8, 10, 0.2);
    backdrop-filter: blur(12px);
    font-size: 0.92rem;
    font-weight: 700;
    transition:
      background 180ms ease,
      border-color 180ms ease,
      transform 180ms ease;
  }

  .lrox-header__cta:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.42);
    transform: translateY(-1px);
  }

  .lrox-hero__content {
    position: relative;
    z-index: 4;
    width: min(calc(100% - 64px), 1440px);
    min-height: calc(100svh - 93px);
    margin: 0 auto;
    padding: 80px 0 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .lrox-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 24px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .lrox-eyebrow span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--lrox-orange);
    box-shadow: 0 0 0 7px rgba(255, 91, 22, 0.15);
  }

  .lrox-hero h1 {
    max-width: 880px;
    margin: 0;
    font-size: clamp(3.7rem, 7vw, 8rem);
    line-height: 0.91;
    letter-spacing: -0.07em;
    font-weight: 730;
  }

  .lrox-hero h1 strong {
    color: var(--lrox-orange);
    font-weight: inherit;
  }

  .lrox-hero p {
    max-width: 610px;
    margin: 30px 0 0;
    color: rgba(255, 255, 255, 0.72);
    font-size: clamp(1.04rem, 1.35vw, 1.24rem);
    line-height: 1.65;
  }

  .lrox-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 38px;
  }

  .lrox-btn {
    min-height: 58px;
    padding: 0 26px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-weight: 700;
    transition:
      transform 180ms ease,
      background 180ms ease,
      border-color 180ms ease;
  }

  .lrox-btn:hover {
    transform: translateY(-2px);
  }

  .lrox-btn--primary {
    background: var(--lrox-orange);
    color: #fff;
  }

  .lrox-btn--primary:hover {
    background: var(--lrox-orange-dark);
  }

  .lrox-btn--secondary {
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(8, 8, 10, 0.25);
    backdrop-filter: blur(14px);
  }

  .lrox-btn--secondary:hover {
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.1);
  }

  .lrox-status {
    position: absolute;
    right: 32px;
    top: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    background: rgba(8, 8, 10, 0.38);
    color: rgba(255, 255, 255, 0.84);
    backdrop-filter: blur(14px);
    font-size: 0.82rem;
    letter-spacing: 0.03em;
  }

  .lrox-status__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3eff8b;
    box-shadow: 0 0 0 6px rgba(62, 255, 139, 0.1);
    animation: lroxPulse 1.8s ease-in-out infinite;
  }

  @keyframes lroxPulse {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }

    50% {
      opacity: 0.5;
      transform: scale(0.82);
    }
  }

  .lrox-video-toggle {
    position: absolute;
    right: 28px;
    bottom: 28px;
    z-index: 8;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 50%;
    background: rgba(8, 8, 10, 0.38);
    color: #fff;
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition: background 180ms ease;
  }

  .lrox-video-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .lrox-scroll {
    position: absolute;
    left: 50%;
    bottom: 30px;
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 11px;
    color: rgba(255, 255, 255, 0.58);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .lrox-scroll span {
    width: 34px;
    height: 1px;
    background: rgba(255, 255, 255, 0.34);
  }

  @media (max-width: 980px) {
    .lrox-nav,
    .lrox-header__cta {
      display: none;
    }

    .lrox-status {
      display: none;
    }

    .lrox-hero__content {
      justify-content: flex-end;
    }
  }

  @media (max-width: 680px) {
    .lrox-header,
    .lrox-hero__content {
      width: min(calc(100% - 30px), 1440px);
    }

    .lrox-header {
      height: 76px;
    }

    .lrox-hero__content {
      min-height: calc(100svh - 77px);
      padding: 70px 0 88px;
    }

    .lrox-hero__video {
      object-position: 58% center;
    }

    .lrox-hero__overlay {
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.25) 0%,
          rgba(0, 0, 0, 0.35) 38%,
          rgba(0, 0, 0, 0.82) 68%,
          rgba(0, 0, 0, 0.96) 100%
        );
    }

    .lrox-hero h1 {
      font-size: clamp(3rem, 14vw, 4.7rem);
    }

    .lrox-hero p {
      font-size: 1rem;
      line-height: 1.55;
    }

    .lrox-actions {
      width: 100%;
    }

    .lrox-btn {
      width: 100%;
    }

    .lrox-scroll {
      display: none;
    }

    .lrox-video-toggle {
      right: 15px;
      bottom: 15px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lrox-status__dot {
      animation: none;
    }
  }
</style>

<script>
  (() => {
    const hero = document.querySelector(".lrox-hero");
    if (!hero) return;

    const video = hero.querySelector(".lrox-hero__video");
    const toggle = hero.querySelector(".lrox-video-toggle");
    const pauseIcon = hero.querySelector(".lrox-pause");
    const playIcon = hero.querySelector(".lrox-play");

    if (!video || !toggle) return;

    function updateButton() {
      const isPlaying = !video.paused;

      pauseIcon.hidden = !isPlaying;
      playIcon.hidden = isPlaying;

      toggle.setAttribute(
        "aria-label",
        isPlaying ? "Pause video" : "Play video"
      );
    }

    toggle.addEventListener("click", async () => {
      if (video.paused) {
        try {
          await video.play();
        } catch (error) {
          console.error("Video playback failed:", error);
        }
      } else {
        video.pause();
      }

      updateButton();
    });

    video.addEventListener("play", updateButton);
    video.addEventListener("pause", updateButton);

    updateButton();
  })();
</script>
