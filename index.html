<section class="lrox-hero" id="home">
  <!-- Blurred background layer -->
  <video
    class="lrox-hero__video lrox-hero__video--background"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="assets/videolrox-hero.mp4" type="video/mp4" />
  </video>

  <!-- Main video: completely visible, no crop -->
  <video
    id="lroxHeroVideo"
    class="lrox-hero__video lrox-hero__video--main"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="assets/videolrox-hero.mp4" type="video/mp4" />
  </video>

  <div class="lrox-hero__text-shade"></div>

  <header class="lrox-header">
    <a class="lrox-logo" href="#home" aria-label="LROX home">
      <span class="lrox-logo__mark"></span>
      <span>LROX</span>
    </a>

    <nav class="lrox-nav" aria-label="Primary navigation">
      <a href="#product">Product</a>
      <a href="#technology">Technology</a>
      <a href="#demo">Demo</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="lrox-header__cta" href="#contact">
      Pilot Partner
    </a>
  </header>

  <div class="lrox-hero__content">
    <div class="lrox-eyebrow">
      <span></span>
      AI-powered bicycle safety
    </div>

    <h1>
      Gefahren erkennen.<br />
      <strong>Bevor sie entstehen.</strong>
    </h1>

    <p>
      LROX erkennt kritische Verkehrssituationen in Echtzeit
      und warnt Radfahrende im entscheidenden Moment.
    </p>

    <div class="lrox-actions">
      <a class="lrox-btn lrox-btn--primary" href="#demo">
        Demo ansehen
        <span aria-hidden="true">→</span>
      </a>

      <a class="lrox-btn lrox-btn--secondary" href="#contact">
        Mehr erfahren
      </a>
    </div>
  </div>

  <div class="lrox-status">
    <span class="lrox-status__dot"></span>
    Live risk detection
  </div>

  <button
    id="lroxVideoToggle"
    class="lrox-video-toggle"
    type="button"
    aria-label="Pause video"
  >
    <span class="lrox-pause">Ⅱ</span>
    <span class="lrox-play" hidden>▶</span>
  </button>
</section>

<style>
  :root {
    --lrox-orange: #ff5a12;
    --lrox-orange-dark: #e94b08;
    --lrox-white: #ffffff;
    --lrox-black: #080808;
  }

  .lrox-hero,
  .lrox-hero * {
    box-sizing: border-box;
  }

  .lrox-hero {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background: var(--lrox-black);
    color: var(--lrox-white);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .lrox-hero a {
    color: inherit;
    text-decoration: none;
  }

  /*
    Background video:
    fills the screen and is blurred so there are no empty bars.
  */
  .lrox-hero__video--background {
    position: absolute;
    inset: -40px;
    z-index: -5;
    width: calc(100% + 80px);
    height: calc(100% + 80px);
    object-fit: cover;
    object-position: center;
    filter:
      blur(30px)
      brightness(1.15)
      saturate(1.15);
    transform: scale(1.08);
    opacity: 0.9;
  }

  /*
    Main video:
    contain means the full frame is visible and nothing is cropped.
  */
  .lrox-hero__video--main {
    position: absolute;
    inset: 0;
    z-index: -4;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    background: transparent;
    filter:
      brightness(1.18)
      contrast(1.02)
      saturate(1.08);
  }

  /*
    Only darkens the left side behind the text.
    The rest of the video remains bright.
  */
  .lrox-hero__text-shade {
    position: absolute;
    inset: 0;
    z-index: -3;
    pointer-events: none;
    background:
      linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.7) 0%,
        rgba(0, 0, 0, 0.48) 25%,
        rgba(0, 0, 0, 0.18) 45%,
        rgba(0, 0, 0, 0.03) 63%,
        transparent 80%
      ),
      linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.12) 0%,
        transparent 38%,
        transparent 75%,
        rgba(0, 0, 0, 0.16) 100%
      );
  }

  .lrox-header {
    position: relative;
    z-index: 10;
    width: min(calc(100% - 64px), 1440px);
    height: 88px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 34px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
  }

  .lrox-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.24em;
    white-space: nowrap;
  }

  .lrox-logo__mark {
    position: relative;
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    border: 2px solid var(--lrox-orange);
    border-radius: 50%;
  }

  .lrox-logo__mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--lrox-orange);
    transform: translate(-50%, -50%);
  }

  .lrox-nav {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-left: auto;
  }

  .lrox-nav a {
    position: relative;
    color: rgba(255, 255, 255, 0.86);
    font-size: 0.94rem;
    transition: color 180ms ease;
  }

  .lrox-nav a::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -9px;
    left: 0;
    height: 1px;
    background: var(--lrox-orange);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 180ms ease;
  }

  .lrox-nav a:hover {
    color: #fff;
  }

  .lrox-nav a:hover::after {
    transform: scaleX(1);
  }

  .lrox-header__cta {
    min-height: 48px;
    padding: 0 20px;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 8, 10, 0.16);
    color: #fff;
    backdrop-filter: blur(12px);
    font-size: 0.92rem;
    font-weight: 700;
    transition:
      background 180ms ease,
      border-color 180ms ease,
      transform 180ms ease;
  }

  .lrox-header__cta:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.55);
    transform: translateY(-1px);
  }

  .lrox-hero__content {
    position: relative;
    z-index: 4;
    width: min(calc(100% - 64px), 1440px);
    min-height: calc(100svh - 89px);
    margin: 0 auto;
    padding: 70px 0 105px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .lrox-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 24px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
  }

  .lrox-eyebrow span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--lrox-orange);
    box-shadow: 0 0 0 7px rgba(255, 90, 18, 0.16);
  }

  .lrox-hero h1 {
    max-width: 790px;
    margin: 0;
    font-size: clamp(3.3rem, 6.5vw, 7.2rem);
    line-height: 0.92;
    letter-spacing: -0.065em;
    font-weight: 750;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.42);
  }

  .lrox-hero h1 strong {
    color: var(--lrox-orange);
    font-weight: inherit;
  }

  .lrox-hero p {
    max-width: 610px;
    margin: 28px 0 0;
    color: rgba(255, 255, 255, 0.9);
    font-size: clamp(1.04rem, 1.3vw, 1.22rem);
    line-height: 1.62;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
  }

  .lrox-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 36px;
  }

  .lrox-btn {
    min-height: 56px;
    padding: 0 25px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-weight: 700;
    transition:
      transform 180ms ease,
      background 180ms ease,
      border-color 180ms ease;
  }

  .lrox-btn:hover {
    transform: translateY(-2px);
  }

  .lrox-btn--primary {
    background: var(--lrox-orange);
    color: #fff;
  }

  .lrox-btn--primary:hover {
    background: var(--lrox-orange-dark);
  }

  .lrox-btn--secondary {
    border: 1px solid rgba(255, 255, 255, 0.42);
    background: rgba(8, 8, 10, 0.2);
    backdrop-filter: blur(14px);
  }

  .lrox-btn--secondary:hover {
    border-color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.12);
  }

  .lrox-status {
    position: absolute;
    right: 32px;
    top: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 999px;
    background: rgba(8, 8, 10, 0.26);
    color: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    font-size: 0.82rem;
  }

  .lrox-status__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3eff8b;
    box-shadow: 0 0 0 6px rgba(62, 255, 139, 0.11);
    animation: lroxPulse 1.8s ease-in-out infinite;
  }

  @keyframes lroxPulse {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }

    50% {
      opacity: 0.55;
      transform: scale(0.82);
    }
  }

  .lrox-video-toggle {
    position: absolute;
    right: 28px;
    bottom: 28px;
    z-index: 8;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    background: rgba(8, 8, 10, 0.26);
    color: #fff;
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition: background 180ms ease;
  }

  .lrox-video-toggle:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  @media (max-width: 980px) {
    .lrox-nav,
    .lrox-header__cta,
    .lrox-status {
      display: none;
    }

    .lrox-hero__content {
      justify-content: flex-end;
    }
  }

  @media (max-width: 680px) {
    .lrox-header,
    .lrox-hero__content {
      width: min(calc(100% - 30px), 1440px);
    }

    .lrox-header {
      height: 76px;
    }

    .lrox-hero__content {
      min-height: calc(100svh - 77px);
      padding: 60px 0 82px;
    }

    .lrox-hero__video--main {
      object-fit: contain;
      object-position: center;
      filter:
        brightness(1.2)
        contrast(1)
        saturate(1.06);
    }

    .lrox-hero__video--background {
      filter:
        blur(24px)
        brightness(1.08)
        saturate(1.12);
    }

    .lrox-hero__text-shade {
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.08) 34%,
          rgba(0, 0, 0, 0.54) 65%,
          rgba(0, 0, 0, 0.86) 100%
        );
    }

    .lrox-hero h1 {
      font-size: clamp(2.8rem, 14vw, 4.5rem);
    }

    .lrox-hero p {
      font-size: 1rem;
      line-height: 1.55;
    }

    .lrox-actions {
      width: 100%;
    }

    .lrox-btn {
      width: 100%;
    }

    .lrox-video-toggle {
      right: 15px;
      bottom: 15px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lrox-status__dot {
      animation: none;
    }
  }
</style>

<script>
  (() => {
    const mainVideo = document.querySelector("#lroxHeroVideo");
    const backgroundVideo = document.querySelector(
      ".lrox-hero__video--background"
    );
    const toggle = document.querySelector("#lroxVideoToggle");
    const pauseIcon = document.querySelector(".lrox-pause");
    const playIcon = document.querySelector(".lrox-play");

    if (
      !mainVideo ||
      !backgroundVideo ||
      !toggle ||
      !pauseIcon ||
      !playIcon
    ) {
      return;
    }

    function updateButton() {
      const isPlaying = !mainVideo.paused;

      pauseIcon.hidden = !isPlaying;
      playIcon.hidden = isPlaying;

      toggle.setAttribute(
        "aria-label",
        isPlaying ? "Pause video" : "Play video"
      );
    }

    toggle.addEventListener("click", async () => {
      if (mainVideo.paused) {
        try {
          await Promise.all([
            mainVideo.play(),
            backgroundVideo.play()
          ]);
        } catch (error) {
          console.error("Video playback failed:", error);
        }
      } else {
        mainVideo.pause();
        backgroundVideo.pause();
      }

      updateButton();
    });

    mainVideo.addEventListener("play", updateButton);
    mainVideo.addEventListener("pause", updateButton);

    mainVideo.addEventListener("timeupdate", () => {
      const difference = Math.abs(
        mainVideo.currentTime - backgroundVideo.currentTime
      );

      if (difference > 0.25) {
        backgroundVideo.currentTime = mainVideo.currentTime;
      }
    });

    updateButton();
  })();
</script>
