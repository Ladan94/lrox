<style>

    z-index: -3;

    height: 100%;

    object-fit: cover;
    object-position: center 38%;
    transform: none;
    background: #000;

  .lrox-hero__overlay {
    position: absolute;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:

        90deg,
        rgba(0, 0, 0, 0.62) 0%,
        rgba(0, 0, 0, 0.42) 30%,
        rgba(0, 0, 0, 0.14) 58%,
        rgba(0, 0, 0, 0.02) 100%
      ),
      linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.14) 0%,
        rgba(0, 0, 0, 0.02) 46%,
        rgba(0, 0, 0, 0.26) 100%
      );
  }

  .lrox-header {
    position: relative;
    z-index: 10;
    width: min(calc(100% - 64px), 1440px);
    height: 88px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 34px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.16);
  }

  .lrox-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.24em;
    white-space: nowrap;
  }

    position: relative;

    flex: 0 0 auto;
    border: 2px solid var(--lrox-orange);
    border-radius: 50%;
  }

  .lrox-logo__mark::after {

    position: absolute;

    left: 50%;

      transform: scale(0.82);

  .lrox-video-toggle {
    position: absolute;
    right: 28px;
    bottom: 28px;
    z-index: 8;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 50%;
    background: rgba(8, 8, 10, 0.3);
    color: #fff;
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition: background 180ms ease;
  }

  .lrox-video-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  @media (max-width: 980px) {
    .lrox-nav,
    .lrox-header__cta,
    .lrox-status {
      display: none;

    .lrox-hero__content {
      justify-content: flex-end;
    }
  }

  @media (max-width: 680px) {
    .lrox-header,
    .lrox-hero__content {
      width: min(calc(100% - 30px), 1440px);
    }

    .lrox-header {
      height: 76px;
    }

    .lrox-hero__content {
      min-height: calc(100svh - 77px);
      padding: 64px 0 82px;
    }

    .lrox-hero__video {
      object-position: 58% 38%;
      filter:
        brightness(1.1)
        contrast(1.01)
        saturate(1.04);
    }

    .lrox-hero__overlay {
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.16) 0%,
          rgba(0, 0, 0, 0.2) 36%,
          rgba(0, 0, 0, 0.62) 68%,
          rgba(0, 0, 0, 0.9) 100%

  @media (prefers-reduced-motion: reduce) {

    }

</style>

<script>
  (() => {
    const video = document.querySelector("#lroxHeroVideo");
    const toggle = document.querySelector("#lroxVideoToggle");
    const pauseIcon = document.querySelector(".lrox-pause");
    const playIcon = document.querySelector(".lrox-play");

    if (!video || !toggle || !pauseIcon || !playIcon) return;

    function updateVideoButton() {
      const isPlaying = !video.paused;

      pauseIcon.hidden = !isPlaying;
      playIcon.hidden = isPlaying;

      toggle.setAttribute(
        "aria-label",
        isPlaying ? "Pause video" : "Play video"
      );
    }

    toggle.addEventListener("click", async () => {
      if (video.paused) {
        try {
          await video.play();
        } catch (error) {
          console.error("Video playback failed:", error);
        }
      } else {
        video.pause();
      }

      updateVideoButton();
    });

    video.addEventListener("play", updateVideoButton);
    video.addEventListener("pause", updateVideoButton);

    updateVideoButton();
  })();
</script>
